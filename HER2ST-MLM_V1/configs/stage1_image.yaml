# Stage 1 image branch MLM pretrain config
branch: image
encoder_name: virchow2   # densenet121 | resnet50 | virchow2
image_agg: class_token   # patch_mean | class_token | concat; 必须与 stage2 一致; concat 时把下面 dim 改成 2560

# data
fold: 0
use_windows: true
window_size: 10
window_stride: 4
window_min_spots: 20

# model
dim: 1280   # densenet121=1024, resnet50=2048, virchow2=1280
enc_depth: 4
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.1

# optimizer
lr: 1.0e-4
weight_decay: 1.0e-3

# training
epochs: 10
batch_size: 64   # 64 windows
seed: 42

# IO
save_dir: runs/stage1_image_window
log_every: 1
