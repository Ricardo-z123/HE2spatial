# Stage 1 spot branch MLM pretrain config
branch: spot

# data
fold: 0

# model
in_dim: 785
enc_depth: 2
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.5

# optimizer
lr: 1.0e-4
weight_decay: 1.0e-3

# training
epochs: 50
batch_size: 1   # per-slide, do not change
seed: 42

# IO
save_dir: runs/stage1_spot
log_every: 1   # log every N epochs
