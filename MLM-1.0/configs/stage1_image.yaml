# Stage 1 image branch MLM pretrain config
branch: image
encoder_name: densenet121   # densenet121 | resnet50 - 2048

# data
fold: 0

# model
in_dim: 1024   # DenseNet output dim, change to 2048 if encoder_name=resnet50
enc_depth: 2
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.5

# optimizer
lr: 1.0e-4
weight_decay: 1.0e-3

# training
epochs: 50
batch_size: 1
seed: 42

# IO
save_dir: runs/stage1_image
log_every: 1
