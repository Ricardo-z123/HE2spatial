# Stage 1 spot branch MLM pretrain config
branch: spot

# data
fold: 0
use_windows: true
window_size: 10
window_stride: 2
window_min_spots: 80

# model
in_dim: 785
enc_depth: 4
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.05

# optimizer
lr: 1.0e-4
weight_decay: 1.0e-3

# training
epochs: 30
batch_size: 1   # one variable-length slide/window sample per batch
seed: 42

# IO
save_dir: runs/stage1_spot_window
log_every: 1   # log every N epochs
