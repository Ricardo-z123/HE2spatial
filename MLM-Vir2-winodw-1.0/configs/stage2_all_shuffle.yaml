# Stage 2 All-Shuffle (baseline-style cross-slide batching)
# Same model + loss as stage2_contrastive, but DataLoader shuffles spots across slides
# instead of using SlideBatchSampler.

# data
fold: 0

# Stage 1 checkpoint base dirs (script appends /fold{i}/best.pt)
spot_ckpt_dir: runs/stage1_spot_window
image_ckpt_dir: runs/stage1_image_window

# Encoder architecture (MUST match Stage 1 training: enc_depth=4, dec_depth=2)
spot_in_dim: 785
image_in_dim: 1280
enc_depth: 4
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.05
encoder_name: virchow2

# Stage 2 specific
projection_dim: 256
temperature: 1.0

# training
batch_size: 128
epochs: 30
lr: 1.0e-4
weight_decay: 1.0e-3
seed: 42

# IO
save_dir: runs/all_shuffle
log_every: 1
