# Stage 2 All-Shuffle UNFREEZE variant
# Same as stage2_all_shuffle.yaml except:
#   - save_dir points to a separate runs/ subfolder so old ckpts are not overwritten
#   - lr lowered 10x (1e-4 -> 1e-5) because encoders are now trainable and we want
#     to gently fine-tune Stage 1 pretrained features instead of destroying them
#   - epochs kept at 30 to match Setting 3 result for direct comparison
#
# Pair with: engine/all_shuffle_train_unfreeze.py (partial_freeze: only Virchow2 frozen)
# Eval with: engine/evel.py (same script as before, just point to this config)

# data
fold: 0   # overridden by 6-fold loop in script

# Stage 1 checkpoint base dirs (REUSE existing ckpts, no need to retrain Stage 1)
spot_ckpt_dir: runs/stage1_spot_window
image_ckpt_dir: runs/stage1_image_window

# Encoder architecture (must match Stage 1 training)
spot_dim: 785
image_dim: 1280
enc_depth: 4
dec_depth: 2
num_heads: 8
dim_head: 64
mask_ratio: 0.05      # unused in Stage 2 forward, kept for MaskedEncoder constructor compatibility
encoder_name: virchow2

# Stage 2 specific
projection_dim: 256
temperature: 1.0

# training
batch_size: 128
epochs: 30
lr: 1.0e-5            # 10x smaller than projection-only setting; encoder fine-tune needs gentle lr
weight_decay: 1.0e-3
seed: 42

# IO
save_dir: runs/all_shuffle_unfreeze   # separate from runs/all_shuffle to preserve old ckpts
log_every: 1
