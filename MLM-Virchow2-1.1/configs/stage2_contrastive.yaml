# Stage 2 CLIP-style contrastive learning config
# Loads frozen Stage 1 encoders (spot + image) + trains only ProjectionHeads + temperature

# data
fold: 0

# Stage 1 checkpoint paths (from previous training output)
spot_ckpt: runs/stage1_spot/best.pt
image_ckpt: runs/stage1_image/best.pt

# Encoder architecture (must match Stage 1 training)
spot_in_dim: 785
image_in_dim: 1280
enc_depth: 2
dec_depth: 2          # decoder unused in Stage 2 but needed to construct MaskedEncoder
num_heads: 8
dim_head: 64
mask_ratio: 0.5       # unused in Stage 2 forward, kept for MaskedEncoder constructor compatibility
encoder_name: virchow2   # densenet121 | resnet50 | virchow2

# Stage 2 specific
projection_dim: 256
temperature: 1.0

# training
batch_size: 128       # spots per batch (all from same slide via SlideBatchSampler)
epochs: 30
lr: 1.0e-4
weight_decay: 1.0e-3
seed: 42

# IO
save_dir: runs/stage2/fold0
log_every: 1
